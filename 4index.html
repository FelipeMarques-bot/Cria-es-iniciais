<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página de Boas-Vindas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      color: #2c3e50;
    }
    .container {
      background-color: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    input, button {
      padding: 10px;
      margin-top: 10px;
      font-size: 1em;
    }
    #nomeRegistrado {
      margin-top: 20px;
      font-weight: bold;
      color: #16a085;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bem-vindo à nossa página</h1>
    <p>Insira seu nome abaixo:</p>
    <input type="text" id="nome" placeholder="Seu nome" />
    <br />
    <button onclick="registrarNome()">Enviar</button>
    <div id="nomeRegistrado"></div>
  </div>

  <script>
    function registrarNome() {
      const nome = document.getElementById('nome').value;
      if (nome.trim() !== '') {
        localStorage.setItem('usuarioNome', nome);
        document.getElementById('nomeRegistrado').innerText = `Nome registrado: ${nome}`;
      } else {
        alert('Por favor, insira um nome válido.');
      }
    }

    // Carrega o nome registrado se houver
    window.onload = function () {
      const nomeSalvo = localStorage.getItem('usuarioNome');
      if (nomeSalvo) {
        document.getElementById('nomeRegistrado').innerText = `Nome registrado: ${nomeSalvo}`;
      }
    };
  </script>
</body>
</html>
